<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Система заявок на автоматизацию</title>
<style>
/* ==========================================================================
   ДИЗАЙН-ТОКЕНЫ
   ========================================================================== */
:root{
  --yellow:#FBBB00;
  --yellow-deep:#E2A400;
  --yellow-soft:#FFF3D6;
  --ink:#1A1A1D;
  --charcoal:#2B2C31;
  --gray-700:#4B4E56;
  --gray-600:#6C6F76;
  --gray-400:#9CA0A8;
  --gray-200:#DEE1E6;
  --gray-150:#E9EBEF;
  --gray-100:#F1F2F5;
  --surface:#FFFFFF;
  --bg:#F5F6F8;
  --green:#1E8E5A; --green-bg:#E6F5EE;
  --red:#D6483F;   --red-bg:#FBEAE9;
  --orange:#DB8A1E;--orange-bg:#FCF0DE;
  --blue:#3568C7;  --blue-bg:#EAF0FB;
  --gray-badge-bg:#EEEFF2;
  --radius-lg:14px;
  --radius-md:10px;
  --radius-sm:7px;
  --shadow-sm:0 1px 2px rgba(15,15,20,.06);
  --shadow-md:0 4px 16px rgba(15,15,20,.08);
  --shadow-lg:0 12px 32px rgba(15,15,20,.14);
  --font:'Segoe UI',-apple-system,BlinkMacSystemFont,Roboto,'Helvetica Neue',Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font);
  background:var(--bg);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
  line-height:1.5;
}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.01em;}
p{margin:0;}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;font-size:14px;}
a{color:inherit;}
::selection{background:var(--yellow-soft);}

/* ==========================================================================
   ЛЭЙАУТ / ШАПКА
   ========================================================================== */
#app-header{
  background:var(--charcoal);
  color:#fff;
  padding:14px 28px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
  position:sticky;
  top:0;
  z-index:40;
  box-shadow:var(--shadow-md);
}
.header-left{display:flex;align-items:center;gap:14px;cursor:pointer;}
.header-logo{
  width:38px;height:38px;border-radius:9px;
  background:var(--yellow);
  display:flex;align-items:center;justify-content:center;
  font-weight:800;color:var(--ink);font-size:16px;flex:none;
}
.header-titles h1{font-size:16px;color:#fff;}
.header-titles p{font-size:11.5px;color:#B7BAC2;margin-top:2px;}
.header-nav{display:flex;align-items:center;gap:4px;flex-wrap:wrap;}
.nav-btn{
  background:transparent;border:none;color:#C6C9D0;
  padding:9px 14px;border-radius:8px;font-size:13.5px;font-weight:600;
  transition:background .15s, color .15s;
}
.nav-btn:hover{background:#3a3b41;color:#fff;}
.nav-btn.active{background:var(--yellow);color:var(--ink);}
.header-right{display:flex;align-items:center;gap:14px;}
.role-switch{
  display:flex;background:#3a3b41;border-radius:9px;padding:3px;gap:2px;
}
.role-switch button{
  border:none;background:transparent;color:#C6C9D0;padding:7px 13px;
  border-radius:7px;font-size:12.5px;font-weight:600;transition:.15s;
}
.role-switch button.active{background:var(--yellow);color:var(--ink);}
.reset-link{
  background:transparent;border:1px solid #4c4e55;color:#B7BAC2;
  padding:7px 11px;border-radius:8px;font-size:12px;font-weight:600;
  display:flex;align-items:center;gap:6px;
}
.reset-link:hover{border-color:#6c6e76;color:#fff;}
.role-note{font-size:10.5px;color:#8d909a;max-width:120px;line-height:1.3;}

#app-root{max-width:1180px;margin:0 auto;padding:28px 28px 80px;}
@media (max-width:720px){
  #app-header{padding:12px 14px;flex-wrap:wrap;}
  #app-root{padding:16px 14px 60px;}
  .header-titles p{display:none;}
}

/* ==========================================================================
   ОБЩИЕ КОМПОНЕНТЫ
   ========================================================================== */
.btn{
  border-radius:9px;border:1px solid transparent;padding:11px 20px;
  font-size:14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;
  transition:transform .08s ease, background .15s, box-shadow .15s, border-color .15s;
  white-space:nowrap;
}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--yellow);color:var(--ink);box-shadow:var(--shadow-sm);}
.btn-primary:hover{background:var(--yellow-deep);}
.btn-primary:disabled{background:var(--gray-200);color:var(--gray-400);cursor:not-allowed;}
.btn-dark{background:var(--ink);color:#fff;}
.btn-dark:hover{background:#000;}
.btn-secondary{background:#fff;color:var(--ink);border-color:var(--gray-200);}
.btn-secondary:hover{border-color:var(--gray-400);background:var(--gray-100);}
.btn-ghost{background:transparent;color:var(--gray-700);border-color:transparent;padding:8px 12px;}
.btn-ghost:hover{background:var(--gray-100);}
.btn-danger{background:#fff;color:var(--red);border-color:#eecbc8;}
.btn-danger:hover{background:var(--red-bg);}
.btn-sm{padding:7px 12px;font-size:12.5px;border-radius:7px;}
.btn-block{width:100%;justify-content:center;}

.card{
  background:var(--surface);border:1px solid var(--gray-150);
  border-radius:var(--radius-lg);box-shadow:var(--shadow-sm);
  padding:24px;
}
.card + .card{margin-top:16px;}
.section-title{font-size:15px;font-weight:700;margin-bottom:4px;}
.section-sub{font-size:12.5px;color:var(--gray-600);margin-bottom:16px;}
.hint{font-size:12px;color:var(--gray-600);margin-top:6px;line-height:1.45;}
.hint b{color:var(--gray-700);}

label.field-label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--charcoal);}
.required-mark{color:var(--red);margin-left:2px;}
.field-block{margin-bottom:18px;}
.field-block:last-child{margin-bottom:0;}
.input,.select,.textarea{
  width:100%;border:1.5px solid var(--gray-200);border-radius:9px;
  padding:10px 13px;font-size:14px;color:var(--ink);background:#fff;
  transition:border-color .15s, box-shadow .15s;
}
.input:focus,.select:focus,.textarea:focus{
  outline:none;border-color:var(--yellow-deep);box-shadow:0 0 0 3px var(--yellow-soft);
}
.textarea{resize:vertical;min-height:88px;line-height:1.5;}
.input.invalid,.select.invalid,.textarea.invalid{border-color:var(--red);}
.field-error{color:var(--red);font-size:12px;margin-top:6px;display:flex;align-items:center;gap:5px;}
.field-row{display:flex;gap:12px;flex-wrap:wrap;}
.field-row > *{flex:1;min-width:180px;}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media (max-width:640px){.two-col{grid-template-columns:1fr;}}

.checkbox-row{display:flex;align-items:flex-start;gap:10px;cursor:pointer;}
.checkbox-row input[type=checkbox]{margin-top:3px;width:17px;height:17px;accent-color:var(--yellow-deep);flex:none;}
.checkbox-row span{font-size:13.5px;color:var(--charcoal);}

.badge{
  display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;
  font-size:11.5px;font-weight:700;white-space:nowrap;
}
.st-gray{background:var(--gray-badge-bg);color:var(--gray-700);}
.st-blue{background:var(--blue-bg);color:var(--blue);}
.st-yellow{background:var(--yellow-soft);color:#8a6300;}
.st-orange{background:var(--orange-bg);color:var(--orange);}
.st-green{background:var(--green-bg);color:var(--green);}
.st-red{background:var(--red-bg);color:var(--red);}

.tag-topic{
  background:var(--gray-100);border:1px solid var(--gray-200);color:var(--gray-700);
  font-size:11.5px;font-weight:600;padding:4px 10px;border-radius:999px;
}

/* Toasts */
#toast-container{position:fixed;top:20px;right:20px;z-index:200;display:flex;flex-direction:column;gap:10px;max-width:340px;}
.toast{
  background:var(--ink);color:#fff;padding:13px 16px;border-radius:10px;font-size:13px;
  box-shadow:var(--shadow-lg);display:flex;gap:10px;align-items:flex-start;
  animation:toast-in .2s ease;
}
.toast.warn{background:#5c3d00;}
.toast .dot{width:8px;height:8px;border-radius:50%;background:var(--yellow);margin-top:5px;flex:none;}
@keyframes toast-in{from{opacity:0;transform:translateY(-8px);}to{opacity:1;transform:translateY(0);}}
.toast.fade-out{animation:toast-out .25s ease forwards;}
@keyframes toast-out{to{opacity:0;transform:translateY(-8px);}}

/* Modal */
.modal-overlay{
  position:fixed;inset:0;background:rgba(20,20,22,.5);z-index:150;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fade-in .15s ease;
}
@keyframes fade-in{from{opacity:0;}to{opacity:1;}}
.modal{
  background:#fff;border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);
  width:100%;max-width:460px;padding:24px;max-height:88vh;overflow:auto;
}
.modal h3{font-size:17px;margin-bottom:6px;}
.modal .modal-sub{font-size:13px;color:var(--gray-600);margin-bottom:18px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}

/* Stepper (форма подачи заявки) */
.stepper-wrap{background:#fff;border:1px solid var(--gray-150);border-radius:var(--radius-lg);padding:20px 22px;margin-bottom:20px;box-shadow:var(--shadow-sm);}
.stepper{display:flex;align-items:flex-start;gap:2px;overflow-x:auto;padding-bottom:4px;}
.step-item{display:flex;flex-direction:column;align-items:center;flex:1;min-width:78px;position:relative;}
.step-circle{
  width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:12.5px;font-weight:700;border:2px solid var(--gray-200);color:var(--gray-400);background:#fff;
  transition:.2s;z-index:2;
}
.step-item.completed .step-circle{background:var(--ink);border-color:var(--ink);color:#fff;}
.step-item.current .step-circle{background:var(--yellow);border-color:var(--yellow-deep);color:var(--ink);box-shadow:0 0 0 4px var(--yellow-soft);}
.step-label{font-size:11px;margin-top:7px;color:var(--gray-400);text-align:center;font-weight:600;max-width:90px;}
.step-item.completed .step-label,.step-item.current .step-label{color:var(--ink);}
.step-line{position:absolute;top:15px;left:calc(-50% + 15px);right:calc(50% + 15px);height:2px;background:var(--gray-200);z-index:1;}
.step-item.completed .step-line{background:var(--ink);}
.step-item:first-child .step-line{display:none;}
.progress-bar-outer{height:6px;background:var(--gray-100);border-radius:99px;margin-top:16px;overflow:hidden;}
.progress-bar-inner{height:100%;background:var(--yellow);border-radius:99px;transition:width .25s ease;}
.progress-label{font-size:11.5px;color:var(--gray-600);margin-top:7px;font-weight:600;}

/* Lifecycle timeline (карточка заявки) */
.lifecycle{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:6px 2px 10px;}
.lc-item{display:flex;flex-direction:column;align-items:center;min-width:96px;flex:1;position:relative;}
.lc-dot{width:26px;height:26px;border-radius:50%;background:#fff;border:2px solid var(--gray-200);z-index:2;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--gray-400);}
.lc-item.done .lc-dot{background:var(--green);border-color:var(--green);color:#fff;}
.lc-item.current .lc-dot{background:var(--yellow);border-color:var(--yellow-deep);color:var(--ink);box-shadow:0 0 0 4px var(--yellow-soft);}
.lc-line{position:absolute;top:12px;left:calc(-50% + 13px);right:calc(50% + 13px);height:2px;background:var(--gray-200);z-index:1;}
.lc-item.done .lc-line{background:var(--green);}
.lc-item:first-child .lc-line{display:none;}
.lc-label{font-size:11px;margin-top:6px;text-align:center;color:var(--gray-500);font-weight:600;max-width:100px;}
.lc-item.done .lc-label,.lc-item.current .lc-label{color:var(--ink);}
.lc-branch{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:12.5px;display:flex;gap:8px;}
.lc-branch.orange{background:var(--orange-bg);color:#7a5312;}
.lc-branch.red{background:var(--red-bg);color:#7d211c;}

/* Reg cards / dropzone */
.choice-cards{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
@media (max-width:640px){.choice-cards{grid-template-columns:1fr;}}
.choice-card{
  border:1.5px solid var(--gray-200);border-radius:12px;padding:16px;cursor:pointer;
  transition:.15s;background:#fff;
}
.choice-card:hover{border-color:var(--gray-400);}
.choice-card.selected{border-color:var(--yellow-deep);background:var(--yellow-soft);box-shadow:0 0 0 1px var(--yellow-deep);}
.choice-card .cc-title{font-weight:700;font-size:14px;margin-bottom:4px;}
.choice-card .cc-sub{font-size:12px;color:var(--gray-600);}
.topic-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.topic-chip{
  border:1.5px solid var(--gray-200);border-radius:10px;padding:11px 12px;cursor:pointer;
  font-size:13px;font-weight:600;text-align:center;transition:.15s;background:#fff;
}
.topic-chip:hover{border-color:var(--gray-400);}
.topic-chip.selected{border-color:var(--yellow-deep);background:var(--yellow-soft);}

.dropzone{
  border:2px dashed var(--gray-200);border-radius:12px;padding:26px;text-align:center;
  color:var(--gray-600);font-size:13px;transition:.15s;background:var(--gray-100);
}
.dropzone.drag{border-color:var(--yellow-deep);background:var(--yellow-soft);}
.link-btn{color:var(--blue);font-weight:700;text-decoration:underline;cursor:pointer;}
.file-item{
  border:1px solid var(--gray-150);border-radius:10px;padding:14px;margin-top:10px;background:var(--gray-100);
}
.file-item-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.file-icon{width:34px;height:34px;border-radius:8px;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-size:10.5px;font-weight:800;flex:none;}
.file-meta{flex:1;min-width:0;}
.file-name{font-size:13px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.file-size{font-size:11.5px;color:var(--gray-600);}

/* Таблицы */
.table-wrap{overflow-x:auto;}
table.reg-table{width:100%;border-collapse:collapse;font-size:13px;min-width:920px;}
table.reg-table th{
  text-align:left;padding:10px 12px;color:var(--gray-600);font-weight:700;font-size:11.5px;
  text-transform:none;border-bottom:2px solid var(--gray-150);white-space:nowrap;cursor:pointer;user-select:none;
}
table.reg-table th:hover{color:var(--ink);}
table.reg-table td{padding:12px;border-bottom:1px solid var(--gray-100);vertical-align:middle;}
table.reg-table tr:hover td{background:var(--gray-100);}
tr.row-warning td{background:var(--orange-bg);}
tr.row-overdue td{background:var(--red-bg);}
.mono-num{font-weight:700;font-family:'Consolas',monospace;font-size:12.5px;}

/* Карточки списков заявок */
.req-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;}
.req-card{
  background:#fff;border:1px solid var(--gray-150);border-radius:var(--radius-md);padding:18px;
  box-shadow:var(--shadow-sm);cursor:pointer;transition:.15s;
}
.req-card:hover{box-shadow:var(--shadow-md);transform:translateY(-1px);border-color:var(--gray-200);}
.req-card-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px;}
.req-num{font-family:'Consolas',monospace;font-weight:700;font-size:12.5px;color:var(--gray-600);}
.req-title{font-size:14px;font-weight:700;margin:4px 0 8px;line-height:1.35;}
.req-meta-row{display:flex;justify-content:space-between;font-size:12px;color:var(--gray-600);margin-top:10px;padding-top:10px;border-top:1px solid var(--gray-100);}

/* Пустое состояние */
.empty-state{text-align:center;padding:60px 20px;}
.empty-state .es-icon{font-size:40px;margin-bottom:14px;}
.empty-state h3{font-size:16px;margin-bottom:8px;}
.empty-state p{color:var(--gray-600);font-size:13.5px;margin-bottom:20px;}

/* Дашборд */
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:20px;}
.kpi-card{background:#fff;border:1px solid var(--gray-150);border-radius:var(--radius-md);padding:18px;box-shadow:var(--shadow-sm);}
.kpi-value{font-size:26px;font-weight:800;line-height:1;}
.kpi-label{font-size:12px;color:var(--gray-600);margin-top:8px;font-weight:600;}
.kpi-card.accent{border-color:var(--yellow-deep);background:linear-gradient(180deg,#fff,var(--yellow-soft));}
.kpi-card.warn .kpi-value{color:var(--red);}

.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:9px;}
.bar-label{width:130px;font-size:12.5px;color:var(--gray-700);flex:none;font-weight:600;}
.bar-track{flex:1;height:16px;background:var(--gray-100);border-radius:6px;overflow:hidden;}
.bar-fill{height:100%;background:var(--yellow);border-radius:6px;transition:width .4s ease;}
.bar-value{width:28px;text-align:right;font-size:12.5px;font-weight:700;flex:none;}

/* Hero / home */
.hero{
  background:linear-gradient(135deg,var(--ink) 0%,#3a3a3f 100%);
  border-radius:var(--radius-lg);padding:44px 40px;color:#fff;margin-bottom:22px;
  position:relative;overflow:hidden;
}
.hero::after{content:'';position:absolute;right:-60px;top:-60px;width:220px;height:220px;background:var(--yellow);opacity:.12;border-radius:50%;}
.hero h2{font-size:26px;margin-bottom:10px;max-width:560px;position:relative;}
.hero p{color:#C6C9D0;font-size:14px;max-width:520px;position:relative;line-height:1.6;}
.hero-actions{display:flex;gap:12px;margin-top:22px;position:relative;flex-wrap:wrap;}

.info-strip{
  background:#fff;border:1px solid var(--gray-150);border-radius:var(--radius-md);
  padding:16px 18px;font-size:13px;color:var(--gray-700);display:flex;gap:12px;align-items:flex-start;
}
.info-strip .ii{font-size:18px;}

.draft-banner{
  background:var(--yellow-soft);border:1px solid var(--yellow-deep);border-radius:var(--radius-md);
  padding:14px 18px;display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;gap:12px;flex-wrap:wrap;
}
.draft-banner strong{font-size:13.5px;}
.draft-banner span{font-size:12.5px;color:#6b4f00;}

.page-head{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:20px;gap:12px;flex-wrap:wrap;}
.page-head h2{font-size:21px;}
.page-head .ph-sub{font-size:13px;color:var(--gray-600);margin-top:4px;}

.filters-bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px;}
.filters-bar .input,.filters-bar .select{width:auto;min-width:150px;}
.filters-bar .search-input{min-width:220px;}

.detail-grid{display:grid;grid-template-columns:2fr 1fr;gap:16px;align-items:start;}
@media (max-width:900px){.detail-grid{grid-template-columns:1fr;}}
.kv-row{display:flex;justify-content:space-between;gap:16px;padding:9px 0;border-bottom:1px solid var(--gray-100);font-size:13px;}
.kv-row:last-child{border-bottom:none;}
.kv-row .k{color:var(--gray-600);flex:none;width:180px;}
.kv-row .v{font-weight:600;text-align:right;flex:1;}
.subhead{font-size:13px;font-weight:700;color:var(--gray-700);margin:18px 0 8px;text-transform:none;}
.subhead:first-child{margin-top:0;}
.comment-box{background:var(--gray-100);border-radius:10px;padding:13px 15px;font-size:13px;margin-bottom:8px;}
.comment-box .cb-head{display:flex;justify-content:space-between;font-size:11.5px;color:var(--gray-600);margin-bottom:6px;font-weight:700;}
.history-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--gray-100);font-size:12.5px;}
.history-item:last-child{border-bottom:none;}
.history-dot{width:8px;height:8px;border-radius:50%;background:var(--gray-400);margin-top:6px;flex:none;}
.history-time{color:var(--gray-500);width:118px;flex:none;}
.review-section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.step-actions{display:flex;justify-content:space-between;margin-top:24px;padding-top:20px;border-top:1px solid var(--gray-100);}
.autosave-note{font-size:11.5px;color:var(--gray-500);display:flex;align-items:center;gap:6px;}
.tooltip-wrap{position:relative;display:inline-block;cursor:help;}
</style>
</head>
<body>

<div id="toast-container"></div>
<div id="modal-root"></div>

<header id="app-header"></header>
<main id="app-root"></main>

<script>
'use strict';
/* ============================================================================
   СЛОЙ ДАННЫХ (DATA LAYER)
   Все обращения к хранилищу проходят через объект DataAPI. Сейчас данные
   лежат в localStorage браузера. При переходе на серверную часть достаточно
   заменить реализацию методов DataAPI на вызовы реального API — остальной
   код (интерфейс, логика экранов) менять не потребуется.
   ============================================================================ */
const LS_KEYS = {
  REQUESTS:'automationApp.requests.v1',
  DRAFT:'automationApp.draft.v1',
  COUNTER:'automationApp.counter.v1',
  SEEDED:'automationApp.seeded.v1'
};

function readJSON(key, fallback){
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : fallback; }
  catch(e){ console.error('Ошибка чтения localStorage', key, e); return fallback; }
}
function writeJSON(key, value){
  try{ localStorage.setItem(key, JSON.stringify(value)); }
  catch(e){ console.error('Ошибка записи localStorage', key, e); }
}
function uid(prefix){ return prefix+'_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function nowISO(){ return new Date().toISOString(); }

const DataAPI = {
  listRequests(){ return readJSON(LS_KEYS.REQUESTS, []); },
  saveAllRequests(list){ writeJSON(LS_KEYS.REQUESTS, list); },
  getRequest(id){ return this.listRequests().find(r=>r.id===id) || null; },
  createRequest(req){ const list=this.listRequests(); list.push(req); this.saveAllRequests(list); return req; },
  updateRequest(id, patchFn){
    const list=this.listRequests();
    const idx=list.findIndex(r=>r.id===id);
    if(idx===-1) return null;
    patchFn(list[idx]);
    list[idx].updatedAt = nowISO();
    this.saveAllRequests(list);
    return list[idx];
  },
  getDraft(){ return readJSON(LS_KEYS.DRAFT, null); },
  saveDraft(d){ writeJSON(LS_KEYS.DRAFT, d); },
  clearDraft(){ localStorage.removeItem(LS_KEYS.DRAFT); },
  nextNumber(){
    const year = new Date().getFullYear();
    const counters = readJSON(LS_KEYS.COUNTER, {});
    const next = (counters[year]||0) + 1;
    counters[year] = next;
    writeJSON(LS_KEYS.COUNTER, counters);
    return 'AUT-'+year+'-'+String(next).padStart(6,'0');
  }
};

function getDeep(obj, path){ return path.split('.').reduce((o,k)=> (o==null?undefined:o[k]), obj); }
function setDeep(obj, path, value){
  const keys = path.split('.'); let o = obj;
  for(let i=0;i<keys.length-1;i++){ if(o[keys[i]]==null) o[keys[i]]={}; o = o[keys[i]]; }
  o[keys[keys.length-1]] = value;
}
function isValidEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test((v||'').trim()); }
function isValidPhone(v){
  const cleaned = (v||'').replace(/[^\d+]/g,'');
  return /^[\d\s()+-]{10,20}$/.test((v||'').trim()) && cleaned.replace(/\D/g,'').length>=10;
}
function addBusinessDays(date, days){
  let d = new Date(date); let added = 0;
  while(added < days){
    d.setDate(d.getDate()+1);
    const day = d.getDay();
    if(day!==0 && day!==6) added++;
  }
  return d;
}
function fmtDate(d){
  if(!d) return '—';
  const date = (d instanceof Date) ? d : new Date(d);
  if(isNaN(date.getTime())) return '—';
  return date.toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'});
}
function fmtDateTime(d){
  const date = (d instanceof Date) ? d : new Date(d);
  if(isNaN(date.getTime())) return '—';
  return date.toLocaleDateString('ru-RU') + ', ' + date.toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
}
function fileExt(name){ const parts=name.split('.'); return parts.length>1 ? parts.pop().toUpperCase() : 'ФАЙЛ'; }
function fileSizeLabel(bytes){
  if(bytes < 1024) return bytes+' Б';
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1)+' КБ';
  return (bytes/1024/1024).toFixed(2)+' МБ';
}
function escapeHtml(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function calcWorkload(w){
  const dur = parseFloat(w.duration), times = parseFloat(w.timesPerPeriod), emp = parseFloat(w.employeesCount);
  if(!dur || !times || !emp) return null;
  const unitToHours = { minutes: 1/60, hours: 1, days: 8 };
  const hoursPerOp = dur * (unitToHours[w.durationUnit] || 1);
  const total = hoursPerOp * times * emp;
  return Math.round(total*10)/10;
}

/* ============================================================================
   РЕНДЕР: ПОШАГОВЫЙ ТАЙМЛАЙН (STEPPER) ФОРМЫ ПОДАЧИ
   ============================================================================ */
function renderStepper(){
  const step = State.wizardStep;
  const items = WIZARD_STEPS.map((label,i)=>{
    const n = i+1;
    let cls = 'step-item';
    if(n < step) cls += ' completed';
    else if(n === step) cls += ' current';
    return `<div class="${cls}">
      <div class="step-line"></div>
      <div class="step-circle">${n<step?'✓':n}</div>
      <div class="step-label">${label}</div>
    </div>`;
  }).join('');
  const percent = Math.round(((step-1)/(WIZARD_STEPS.length-1))*100);
  return `
    <div class="stepper-wrap">
      <div class="stepper">${items}</div>
      <div class="progress-bar-outer"><div class="progress-bar-inner" style="width:${percent}%"></div></div>
      <div class="progress-label">Заполнено ${percent}%</div>
    </div>
  `;
}

/* ---- поля-хелперы ---- */
function fieldText(opts){
  const {label, path, value, required, hint, error, placeholder, type} = opts;
  return `
    <div class="field-block">
      <label class="field-label">${label}${required?'<span class="required-mark">*</span>':''}</label>
      <input class="input${error?' invalid':''}" type="${type||'text'}" data-field="${path}" value="${escapeHtml(value||'')}" placeholder="${escapeHtml(placeholder||'')}">
      ${hint?`<div class="hint">${hint}</div>`:''}
      ${error?`<div class="field-error">⚠ ${error}</div>`:''}
    </div>`;
}
function fieldTextarea(opts){
  const {label, path, value, required, hint, error, placeholder, rows} = opts;
  return `
    <div class="field-block">
      <label class="field-label">${label}${required?'<span class="required-mark">*</span>':''}</label>
      <textarea class="textarea${error?' invalid':''}" data-field="${path}" placeholder="${escapeHtml(placeholder||'')}" rows="${rows||4}">${escapeHtml(value||'')}</textarea>
      ${hint?`<div class="hint">${hint}</div>`:''}
      ${error?`<div class="field-error">⚠ ${error}</div>`:''}
    </div>`;
}
function fieldSelect(opts){
  const {label, path, value, required, options, hint, error, placeholder} = opts;
  const optHtml = (placeholder? `<option value="">${escapeHtml(placeholder)}</option>` : '') +
    options.map(o=>{
      const val = Array.isArray(o)?o[0]:o, lbl = Array.isArray(o)?o[1]:o;
      return `<option value="${escapeHtml(val)}"${value===val?' selected':''}>${escapeHtml(lbl)}</option>`;
    }).join('');
  return `
    <div class="field-block">
      <label class="field-label">${label}${required?'<span class="required-mark">*</span>':''}</label>
      <select class="select${error?' invalid':''}" data-field="${path}">${optHtml}</select>
      ${hint?`<div class="hint">${hint}</div>`:''}
      ${error?`<div class="field-error">⚠ ${error}</div>`:''}
    </div>`;
}

/* ============================================================================
   ВАЛИДАЦИЯ ШАГОВ МАСТЕРА
   ============================================================================ */
function validateStep(step){
  const w = State.wizard, e = {};
  if(step===1){
    if(!w.applicant.fio.trim()) e['applicant.fio'] = 'Укажите ФИО';
    if(!w.applicant.phone.trim()) e['applicant.phone'] = 'Укажите телефон для связи';
    else if(!isValidPhone(w.applicant.phone)) e['applicant.phone'] = 'Проверьте формат номера телефона';
    if(!w.applicant.email.trim()) e['applicant.email'] = 'Укажите электронную почту';
    else if(!isValidEmail(w.applicant.email)) e['applicant.email'] = 'Проверьте формат электронной почты';
    w.applicant.extraEmails.forEach((em,i)=>{ if(em.trim() && !isValidEmail(em)) e['applicant.extraEmails.'+i] = 'Проверьте формат email'; });
    if(!w.applicant.department.trim()) e['applicant.department'] = 'Укажите структурное подразделение';
    if(!w.applicant.consent) e['applicant.consent'] = 'Необходимо подтвердить согласие';
  }
  if(step===2){
    if(!w.type) e['type'] = 'Выберите тип заявки';
    if(w.type==='upgrade' && !w.existingSystemName.trim()) e['existingSystemName'] = 'Укажите название существующей системы';
  }
  if(step===3){
    if(!w.topic) e['topic'] = 'Выберите тематику';
    if(w.topic==='Другое' && !w.topicOther.trim()) e['topicOther'] = 'Укажите тематику';
  }
  if(step===4){
    if(!w.process.trim()) e['process'] = 'Опишите текущий процесс';
    if(!w.problem.trim()) e['problem'] = 'Опишите, что требует автоматизации';
    if(!w.desiredResult.trim()) e['desiredResult'] = 'Опишите желаемый результат';
    if(!w.beneficiaries.trim()) e['beneficiaries'] = 'Укажите получателей выгоды';
    if(!w.resultRecipient.trim()) e['resultRecipient'] = 'Укажите получателя результата';
  }
  if(step===5){
    if(!w.__confirm) e['__confirm'] = 'Необходимо подтвердить, что данные верны';
  }
  State.wizardErrors = e;
  return Object.keys(e).length===0;
}

/* ============================================================================
   ОТПРАВКА ЗАЯВКИ
   ============================================================================ */
function submitWizard(){
  const w = State.wizard;

  if(State.editingRequestId){
    const updated = DataAPI.updateRequest(State.editingRequestId, req=>{
      req.type = w.type; req.existingSystemName = w.existingSystemName;
      req.topic = w.topic; req.topicOther = w.topicOther;
      req.process = w.process; req.problem = w.problem; req.desiredResult = w.desiredResult; req.methodSuggestion = w.methodSuggestion;
      req.documents = w.documents; req.beneficiaries = w.beneficiaries; req.workload = w.workload; req.resultRecipient = w.resultRecipient;
      req.applicant = w.applicant;
      req.status = 'review';
      req.reviewDueDate = addBusinessDays(new Date(), 5).toISOString();
      req.history.push({status:'review', comment:'Заявка дополнена заявителем и повторно направлена на рассмотрение.', actor:'Заявитель', ts:nowISO()});
    });
    NotifyService.resubmitted(updated);
    State.lastCreatedNumber = updated.number;
    State.editingRequestId = null;
    DataAPI.clearDraft();
    State.wizardStep = 6;
    render();
    return;
  }

  const req = {
    id: uid('req'),
    number: DataAPI.nextNumber(),
    status: 'review',
    createdAt: nowISO(),
    updatedAt: nowISO(),
    applicant: w.applicant,
    type: w.type, existingSystemName: w.existingSystemName,
    topic: w.topic, topicOther: w.topicOther,
    process: w.process, problem: w.problem, desiredResult: w.desiredResult, methodSuggestion: w.methodSuggestion,
    documents: w.documents, beneficiaries: w.beneficiaries, workload: w.workload, resultRecipient: w.resultRecipient,
    responsible: '', deadline: null,
    reviewDueDate: addBusinessDays(new Date(), 5).toISOString(),
    history: [
      {status:'submitted', comment:'', actor:'Заявитель', ts:nowISO()},
      {status:'review', comment:'', actor:'Система', ts:nowISO()}
    ]
  };
  DataAPI.createRequest(req);
  NotifyService.requestRegistered(req);
  DataAPI.clearDraft();
  State.lastCreatedNumber = req.number;
  State.wizardStep = 6;
  render();
}

/* ============================================================================
   ТАЙМЛАЙН ЖИЗНЕННОГО ЦИКЛА ЗАЯВКИ
   ============================================================================ */
function renderLifecycle(r){
  const labels = { submitted:'Отправлена', review:'На рассмотрении', accepted:'Принята в работу', development:'В разработке', testing:'Тестирование', done:'Готово', closed:'Закрыта' };
  let currentIdx = LIFECYCLE_ORDER.indexOf(r.status);
  if(r.status==='clarification'){
    // остаёмся визуально на этапе "На рассмотрении", с боковой веткой уточнения
    currentIdx = LIFECYCLE_ORDER.indexOf('review');
  }
  if(r.status==='rejected'){
    currentIdx = LIFECYCLE_ORDER.indexOf('submitted');
  }

  const items = LIFECYCLE_ORDER.map((key,i)=>{
    let cls='lc-item';
    if(r.status!=='rejected'){
      if(i < currentIdx || (i===currentIdx && r.status!=='clarification' && key===r.status) ) cls += (i<currentIdx?' done':' current');
      else if(i===currentIdx) cls += ' current';
    }
    const dotContent = (cls.includes('done')) ? '✓' : (i+1);
    return `<div class="${cls}"><div class="lc-line"></div><div class="lc-dot">${dotContent}</div><div class="lc-label">${labels[key]}</div></div>`;
  }).join('');

  let branch = '';
  if(r.status==='clarification'){
    branch = `<div class="lc-branch orange">⚠ <div>Заявка находится на статусе <b>«Требуется уточнение»</b>. После дополнения информации она вернётся на рассмотрение.</div></div>`;
  } else if(r.status==='rejected'){
    branch = `<div class="lc-branch red">✕ <div>Заявка была <b>отклонена</b> на этапе рассмотрения.</div></div>`;
  }

  return `<div class="lifecycle">${items}</div>${branch}`;
}

function isOverdueReview(r){
  return ['review','clarification'].includes(r.status) && new Date(r.reviewDueDate) < new Date();
}
function isDueSoon(r){
  if(!['review','clarification'].includes(r.status)) return false;
  const diff = (new Date(r.reviewDueDate) - new Date()) / (1000*60*60*24);
  return diff >= 0 && diff <= 1.5;
}

function filteredRegistry(){
  const all = DataAPI.listRequests();
  const f = State.regFilter;
  let list = all.filter(r=>{
    if(f.q){
      const q = f.q.toLowerCase();
      if(!(r.number.toLowerCase().includes(q) || r.applicant.fio.toLowerCase().includes(q))) return false;
    }
    if(f.status && r.status!==f.status) return false;
    if(f.topic && r.topic!==f.topic) return false;
    if(f.region && r.applicant.region!==f.region) return false;
    return true;
  });
  list.sort((a,b)=>{
    let av, bv;
    if(f.sortBy==='createdAt'){ av=new Date(a.createdAt); bv=new Date(b.createdAt); }
    else if(f.sortBy==='number'){ av=a.number; bv=b.number; }
    else if(f.sortBy==='status'){ av=STATUSES[a.status].label; bv=STATUSES[b.status].label; }
    else { av=a[f.sortBy]||''; bv=b[f.sortBy]||''; }
    if(av<bv) return f.sortDir==='asc'?-1:1;
    if(av>bv) return f.sortDir==='asc'?1:-1;
    return 0;
  });
  return list;
}

function render(){
  renderHeader();
  const root = document.getElementById('app-root');
  let html = '';
  switch(State.screen){
    case 'home': html = renderHome(); break;
    case 'wizard': html = renderWizard(); break;
    case 'myRequests': html = renderMyRequests(); break;
    case 'requestDetail': html = renderApplicantRequestDetail(); break;
    case 'adminDashboard': html = renderAdminDashboard(); break;
    case 'adminRegistry': html = renderAdminRegistry(); break;
    case 'adminRequestDetail': html = renderAdminRequestDetail(); break;

  window.scrollTo({top:0, behavior:'instant'});
}

/* ============================================================================
   НАВИГАЦИЯ / ДЕЙСТВИЯ
   ============================================================================ */
function goto(screen){ State.screen = screen; render(); }

function startNewRequest(){
  const draft = DataAPI.getDraft();
  if(draft){
    State.wizard = draft;
  } else {
    State.wizard = newWizardData();
  }
  State.editingRequestId = null;
  State.wizardStep = 1;
  State.wizardErrors = {};
  State.screen = 'wizard';
  render();
}
function continueDraft(){
  State.wizard = DataAPI.getDraft() || newWizardData();
  State.editingRequestId = null;
  State.wizardStep = 1;
  State.wizardErrors = {};
  State.screen = 'wizard';
  render();
}
function discardDraft(){ DataAPI.clearDraft(); render(); }

let autosaveTimer = null;
function autosaveDraft(){
  clearTimeout(autosaveTimer);
  autosaveTimer = setTimeout(()=>{
    if(State.wizard && !State.editingRequestId){
      DataAPI.saveDraft(State.wizard);
      const note = document.getElementById('autosave-note');
      if(note) note.innerHTML = '<span>✓</span> Черновик сохранён';
    }
  }, 500);
}

/* ============================================================================
   ОБРАБОТКА СОБЫТИЙ (делегирование)
   ============================================================================ */
document.addEventListener('input', function(e){
  const t = e.target;
  const path = t.dataset.field;
  if(!path) return;

  if(State.wizard){
    if(path.startsWith('documents:')){
      const [,docId,key] = path.split(':');
      const doc = State.wizard.documents.find(d=>d.id===docId);
      if(doc) doc[key] = t.value;
    } else if(path.startsWith('applicant.extraEmails.')){
      const idx = parseInt(path.split('.').pop(),10);
      State.wizard.applicant.extraEmails[idx] = t.value;
    } else if(path !== '__confirm'){
      setDeep(State.wizard, path, t.value);
    }
    autosaveDraft();
    // Пересчёт трудоёмкости на 4-м шаге отображается в info-strip — обновим карточку без потери фокуса на других полях,
    // только если событие пришло из полей трудоёмкости.
  }
  // Фильтры "Мои заявки"
  if(t.dataset.filter==='my-q'){ State.myFilter.q = t.value; renderMyRequestsSoft(); }
  if(t.dataset.filter==='reg-q'){ State.regFilter.q = t.value; renderRegistrySoft(); }
});

function renderMyRequestsSoft(){ if(State.screen==='myRequests') render(); }
function renderRegistrySoft(){ if(State.screen==='adminRegistry') render(); }

document.addEventListener('change', function(e){
  const t = e.target;
  const path = t.dataset.field;
  if(path && State.wizard){
    if(path==='applicant.consent'){ State.wizard.applicant.consent = t.checked; render(); return; }
    if(path==='__confirm'){ State.wizard.__confirm = t.checked; return; }
    setDeep(State.wizard, path, t.value);
    autosaveDraft();
    if(path==='type' || path==='topic' || path==='workload.frequency' || path==='workload.durationUnit'){ render(); }
    else if(path.startsWith('workload.')){ render(); }
    return;
  }
  if(t.dataset.filter){
    const map = {
      'my-status':()=>State.myFilter.status=t.value,
      'my-topic':()=>State.myFilter.topic=t.value,
      'reg-status':()=>State.regFilter.status=t.value,
      'reg-topic':()=>State.regFilter.topic=t.value,
      'reg-region':()=>State.regFilter.region=t.value
    };
    if(map[t.dataset.filter]){ map[t.dataset.filter](); render(); }
    return;
  }
  if(t.dataset.action==='file-input'){ handleFiles(t.files); }
});

document.addEventListener('dragover', function(e){
  const dz = e.target.closest && e.target.closest('#dropzone');
  if(dz){ e.preventDefault(); dz.classList.add('drag'); }
});
document.addEventListener('dragleave', function(e){
  const dz = e.target.closest && e.target.closest('#dropzone');
  if(dz){ dz.classList.remove('drag'); }
});
document.addEventListener('drop', function(e){
  const dz = e.target.closest && e.target.closest('#dropzone');
  if(dz){
    e.preventDefault(); dz.classList.remove('drag');
    if(e.dataTransfer && e.dataTransfer.files) handleFiles(e.dataTransfer.files);
  }
});
function handleFiles(fileList){
  if(!State.wizard || !fileList || !fileList.length) return;
  Array.from(fileList).forEach(f=>{
    State.wizard.documents.push({ id: uid('doc'), name: f.name, ext: fileExt(f.name), sizeLabel: fileSizeLabel(f.size), usage:'', futureUse:'' });
  });
  autosaveDraft();
  render();
}

document.addEventListener('click', function(e){
  const el = e.target.closest('[data-action]');
  if(!el) return;
  const action = el.dataset.action;

  switch(action){
    case 'nav': goto(el.dataset.screen); break;
    case 'set-role':
      State.role = el.dataset.role;
      State.screen = State.role==='admin' ? 'adminDashboard' : 'home';
      render();
      break;
    case 'reset-data': openResetConfirmModal(); break;
    case 'confirm-reset-data': closeModal(); resetDemoData(); break;
    case 'modal-close': case 'modal-overlay': closeModal(); break;

    case 'new-request': startNewRequest(); break;
    case 'continue-draft': continueDraft(); break;
    case 'discard-draft': discardDraft(); break;

    case 'add-extra-email': State.wizard.applicant.extraEmails.push(''); render(); break;
    case 'remove-extra-email': State.wizard.applicant.extraEmails.splice(parseInt(el.dataset.index,10),1); autosaveDraft(); render(); break;
    case 'remove-doc': State.wizard.documents = State.wizard.documents.filter(d=>d.id!==el.dataset.docid); autosaveDraft(); render(); break;

    case 'pick-type': State.wizard.type = el.dataset.value; autosaveDraft(); render(); break;
    case 'pick-topic': State.wizard.topic = el.dataset.value; autosaveDraft(); render(); break;

    case 'wizard-back':
      State.wizardStep = Math.max(1, State.wizardStep-1);
      State.wizardErrors = {};
      render();
      break;
    case 'wizard-next':
      if(validateStep(State.wizardStep)){ State.wizardStep++; render(); } else { render(); }
      break;
    case 'wizard-submit':
      if(validateStep(5)){ submitWizard(); } else { render(); }
      break;
    case 'edit-step': State.wizardStep = parseInt(el.dataset.step,10); State.wizardErrors={}; render(); break;

    case 'open-request': State.selectedId = el.dataset.id; State.screen = 'requestDetail'; render(); break;
    case 'resume-clarification': {
      const r = DataAPI.getRequest(el.dataset.id);
      State.wizard = {
        applicant: JSON.parse(JSON.stringify(r.applicant)),
        type: r.type, existingSystemName: r.existingSystemName,
        topic: r.topic, topicOther: r.topicOther,
        process: r.process, problem: r.problem, desiredResult: r.desiredResult, methodSuggestion: r.methodSuggestion,
        documents: JSON.parse(JSON.stringify(r.documents||[])),
        beneficiaries: r.beneficiaries,
        workload: JSON.parse(JSON.stringify(r.workload)),
        resultRecipient: r.resultRecipient,
        __confirm:false
      };
      State.editingRequestId = r.id;
      State.wizardStep = 4;
      State.wizardErrors = {};
      State.screen = 'wizard';
      render();
      break;
    }

    case 'open-admin-request': State.selectedId = el.dataset.id; State.screen = 'adminRequestDetail'; render(); break;

    case 'admin-accept': openAcceptModal(el.dataset.id); break;
    case 'admin-clarify': openClarifyModal(el.dataset.id); break;
    case 'admin-reject': openRejectModal(el.dataset.id); break;
    case 'admin-advance': openAdvanceModal(el.dataset.id, el.dataset.next); break;

    case 'confirm-accept': {
      const id = el.dataset.id;
      const deadline = document.getElementById('modal-deadline').value;
      const responsible = document.getElementById('modal-responsible').value;
      const comment = document.getElementById('modal-comment').value;
      const updated = DataAPI.updateRequest(id, req=>{
        const old = req.status;
        req.status = 'accepted';
        req.deadline = deadline ? new Date(deadline).toISOString() : null;
        req.responsible = responsible;
        req.history.push({status:'accepted', comment, actor:'Администратор', ts:nowISO()});
      });
      closeModal();
      NotifyService.statusChanged(updated, 'review', 'accepted');
      render();
      break;
    }
    case 'confirm-clarify': {
      const id = el.dataset.id;
      const comment = document.getElementById('modal-comment').value.trim();
      if(!comment){ document.getElementById('modal-err').style.display='flex'; break; }
      const updated = DataAPI.updateRequest(id, req=>{
        req.status = 'clarification';
        req.history.push({status:'clarification', comment, actor:'Администратор', ts:nowISO()});
      });
      closeModal();
      NotifyService.clarificationRequested(updated);
      render();
      break;
    }
    case 'confirm-reject': {
      const id = el.dataset.id;
      const comment = document.getElementById('modal-comment').value.trim();
      if(!comment){ document.getElementById('modal-err').style.display='flex'; break; }
      const updated = DataAPI.updateRequest(id, req=>{
        req.status = 'rejected';
        req.history.push({status:'rejected', comment, actor:'Администратор', ts:nowISO()});
      });
      closeModal();
      NotifyService.statusChanged(updated, updated.status, 'rejected');
      render();
      break;
    }
    case 'confirm-advance': {
      const id = el.dataset.id, next = el.dataset.next;
      const comment = document.getElementById('modal-comment').value;
      let oldStatus;
      const updated = DataAPI.updateRequest(id, req=>{
        oldStatus = req.status;
        req.status = next;
        req.history.push({status:next, comment, actor:'Администратор', ts:nowISO()});
      });
      closeModal();
      NotifyService.statusChanged(updated, oldStatus, next);
      render();
      break;
    }
  }
});

/* ============================================================================
   ИНИЦИАЛИЗАЦИЯ
   ============================================================================ */
function init(){
  seedDemoData();
  render();
}
document.addEventListener('DOMContentLoaded', init);
</script>
