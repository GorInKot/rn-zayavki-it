name: zayavki

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-zayavki}
      POSTGRES_USER: ${POSTGRES_USER:-zayavki}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zayavki}
      TZ: Europe/Moscow
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Порт открыт только на локальном интерфейсе — для разработки и резервного копирования.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks: [internal]

  backend:
    build: ./backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-zayavki}:${POSTGRES_PASSWORD:-zayavki}@db:5432/${POSTGRES_DB:-zayavki}
      # Заголовки X-Forwarded-For принимаются только от nginx внутри этой сети.
      FORWARDED_ALLOW_IPS: 172.28.0.0/24
    volumes:
      - uploads:/data/uploads
    depends_on:
      db:
        condition: service_healthy
    networks: [internal]

  frontend:
    build:
      context: ./frontend
      args:
        APP_BASE_PATH: ${APP_BASE_PATH:-/}
    restart: unless-stopped
    environment:
      APP_BASE_PATH: ${APP_BASE_PATH:-/}
      BACKEND_URL: http://backend:8000
    ports:
      - "${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [internal]

networks:
  internal:
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  pgdata:
  uploads:
